name: sqli-demo-docker

services:
  db:
    image: mysql:8.4
    ports:
      # MySQL Workbench on this Windows host connects through localhost:3307.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      # Local demo credentials, unrelated to the Windows MySQL installation.
      MYSQL_ROOT_PASSWORD: local_demo_root_2026
      MYSQL_DATABASE: sqli_demo
      MYSQL_USER: sqli_demo
      MYSQL_PASSWORD: local_demo_app_2026
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}"
          -e 'SELECT id FROM users LIMIT 1; SELECT id FROM posts LIMIT 1;' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 30

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      SQLI_SESSION_COOKIE: SQLI_DEMO_DOCKER
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sqli_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: sqli_demo
      SPRING_DATASOURCE_PASSWORD: local_demo_app_2026
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
