# Native Java/MySQL demo: isolated from the Docker demo by schema, port and cookie.
server.address=${SQLI_HTTP_ADDRESS:127.0.0.1}
server.port=${SQLI_HTTP_PORT:8081}

spring.datasource.url=${SQLI_DB_URL:jdbc:mysql://127.0.0.1:3306/sqli_demo_native?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SQLI_DB_USER:sqli_demo_native}
spring.datasource.password=${SQLI_DB_PASSWORD:local_code_db_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
spring.thymeleaf.cache=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=${SQLI_SESSION_COOKIE:SQLI_DEMO_NATIVE}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
